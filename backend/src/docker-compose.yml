version: '3.8'

services:
  db:
    container_name: db
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASS
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - $DB_PORT:5432

volumes:
  postgres_data:
